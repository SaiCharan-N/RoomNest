# Development value only. Replace JWT_SECRET with a long random string
# (for example: openssl rand -hex 32) before using this anywhere real, or
# create the Secret from the command line instead of committing it:
#   kubectl -n roomnest create secret generic roomnest-secret \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: roomnest-secret
  labels:
    app.kubernetes.io/part-of: roomnest
type: Opaque
stringData:
  JWT_SECRET: change_this_to_a_long_random_secret
