services:
  mongodb:
    image: mongo:7
    container_name: roomnest-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - roomnest-network

  backend:
    build:
      context: ./server
    container_name: roomnest-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/roomnest
      JWT_SECRET: change_this_to_a_long_random_secret
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - roomnest-network

  frontend:
    build:
      context: ./client
    container_name: roomnest-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - roomnest-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  roomnest-network:
    driver: bridge
